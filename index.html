<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harsh Singh — Director · Writer · Producer</title>
  <meta name="description" content="Harsh Singh — Director, Writer and Producer.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #090909;
      color: #f2f0eb;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* ---------- NAVIGATION ---------- */

    .nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3vw;
      background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
      pointer-events: none;
    }

    .brand,
    .nav a {
      pointer-events: auto;
    }

    .brand {
      color: #f2f0eb;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .18em;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: rgba(242,240,235,.82);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      transition: opacity .25s ease;
    }

    .nav-links a:hover {
      opacity: .55;
    }

    /* ---------- HERO ---------- */

    .hero {
      position: relative;
      height: 100vh;
      min-height: 650px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      background: #090909;
    }

    /* Moving strip of your future animation/film stills */
    .image-track {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      width: max-content;
      padding-left: 4vw;
      animation: move-left 42s linear infinite;
      will-change: transform;
    }

    .still {
      position: relative;
      flex: 0 0 43vw;
      height: 72vh;
      min-height: 470px;
      overflow: hidden;
      background:
        linear-gradient(135deg, #252525, #111);
      border-radius: 2px;
    }

    .still img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(.82);
    }

    .still::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.15)),
        linear-gradient(to right, rgba(0,0,0,.12), transparent 35%, rgba(0,0,0,.08));
      pointer-events: none;
    }

    @keyframes move-left {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* Dark cinematic treatment over the entire hero */
    .hero-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(to bottom,
          rgba(0,0,0,.52) 0%,
          rgba(0,0,0,.08) 22%,
          rgba(0,0,0,.05) 50%,
          rgba(0,0,0,.68) 100%
        ),
        linear-gradient(to right,
          rgba(0,0,0,.48) 0%,
          transparent 35%,
          transparent 70%,
          rgba(0,0,0,.28) 100%
        );
    }

    /* ---------- HERO TEXT ---------- */

    .hero-content {
      position: relative;
      z-index: 5;
      width: min(92vw, 1500px);
      margin: 0 auto;
      padding: 0 0 8vh;
    }

    .eyebrow {
      margin-bottom: 13px;
      color: #c8a66a;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: clamp(64px, 10vw, 150px);
      line-height: .88;
      font-weight: 300;
      letter-spacing: -.055em;
      max-width: 900px;
    }

    .hero-subtitle {
      margin-top: 22px;
      font-size: clamp(14px, 1.35vw, 19px);
      color: rgba(242,240,235,.78);
      letter-spacing: .04em;
    }

    .hero-action {
      display: inline-flex;
      margin-top: 34px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(242,240,235,.75);
      color: #f2f0eb;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      transition: opacity .25s ease;
    }

    .hero-action:hover {
      opacity: .55;
    }

    /* ---------- BOTTOM META ---------- */

    .hero-meta {
      position: absolute;
      z-index: 5;
      right: 3vw;
      bottom: 8vh;
      text-align: right;
      color: rgba(242,240,235,.58);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .scroll-note {
      position: absolute;
      z-index: 5;
      left: 3vw;
      bottom: 24px;
      color: rgba(242,240,235,.42);
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 700px) {
      .nav {
        height: 68px;
        padding: 0 20px;
      }

      .nav-links {
        gap: 14px;
      }

      .nav-links a {
        font-size: 8px;
        letter-spacing: .12em;
      }

      .hero {
        min-height: 650px;
      }

      .still {
        flex-basis: 78vw;
        height: 65vh;
      }

      .hero-content {
        width: calc(100% - 40px);
        padding-bottom: 70px;
      }

      .hero-title {
        font-size: clamp(58px, 17vw, 100px);
      }

      .hero-meta {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .image-track {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <header class="nav">
    <a class="brand" href="#">HARSH SINGH</a>

    <nav class="nav-links">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">

      <!--

        etc.
      -->

      <div class="image-track" aria-hidden="true">

        <div class="still">
          <img src="images/still-01.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-02.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-03.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-04.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-05.jpg" alt="">
        </div>

        <!-- Duplicate set creates a continuous loop -->
        <div class="still">
          <img src="images/still-01.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-02.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-03.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-04.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-05.jpg" alt="">
        </div>

      </div>

      <div class="hero-vignette"></div>

      <div class="hero-content">
        <div class="eyebrow">Director · Writer · Producer</div>
        <h1 class="hero-title">Harsh Singh</h1>
        <p class="hero-subtitle">Stories, worlds and images made for the screen.</p>
        <a class="hero-action" href="#work">View selected work&nbsp; →</a>
      </div>

      <div class="hero-meta">Filmmaking · Animation · VFX</div>
      <div class="scroll-note">Scroll to explore ↓</div>

    </section>

    <!-- Placeholder so the navigation has somewhere to go later -->
    <section id="work" style="height: 1px;"></section>
    <section id="about" style="height: 1px;"></section>
    <section id="contact" style="height: 1px;"></section>
  </main>

</body>
</html>
