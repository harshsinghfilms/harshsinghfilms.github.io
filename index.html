<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Harsh Singh — Writer · Director · Animator</title>

  <meta
    name="description"
    content="Harsh Singh — Writer, Director and Animator. Where 3D, color and storytelling become experience."
  >

  <style>

    /* =========================================================
       FOUNDATION
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #0A0A0A;
      color: #F1EEE7;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;

      height: 82px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 3.5vw;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.62),
          transparent
        );

      pointer-events: none;
    }

    .brand,
    .nav-links {
      pointer-events: auto;
    }

    .brand {
      color: #F1EEE7;
      text-decoration: none;

      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .nav-links {
      display: flex;
      gap: 34px;
    }

    .nav-links a {
      color: rgba(241, 238, 231, 0.78);
      text-decoration: none;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      transition: opacity 0.25s ease;
    }

    .nav-links a:hover {
      opacity: 0.5;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 650px;

      overflow: hidden;

      background: #0A0A0A;
    }


    /* =========================================================
       CINEMATIC SLIDESHOW
       
       Source images: 1920 × 818
       Aspect ratio: approximately 2.35:1

       The slideshow spans the full width of the screen.
       The original cinematic composition is preserved.
    ========================================================= */

    .image-slideshow {
      position: absolute;

      top: 50%;
      left: 0;

      width: 100%;

      transform: translateY(-50%);

      aspect-ratio: 1920 / 818;

      z-index: 0;

      overflow: hidden;

      background: #0A0A0A;
    }


    /* Every still occupies the exact same position */

    .still {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      opacity: 0;

      animation: cinematic-fade 30s infinite;

      will-change: opacity;
    }


    /* Preserve the complete widescreen frame */

    .still img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
      object-position: center;

      filter: saturate(0.88);

      animation: cinematic-scale 30s infinite;

      will-change: transform;
    }


    /* =========================================================
       FRAME TIMING
       
       10 images
       3 seconds between each image
       30 second complete cycle
    ========================================================= */

    .still:nth-child(1),
    .still:nth-child(1) img {
      animation-delay: 0s;
    }

    .still:nth-child(2),
    .still:nth-child(2) img {
      animation-delay: 3s;
    }

    .still:nth-child(3),
    .still:nth-child(3) img {
      animation-delay: 6s;
    }

    .still:nth-child(4),
    .still:nth-child(4) img {
      animation-delay: 9s;
    }

    .still:nth-child(5),
    .still:nth-child(5) img {
      animation-delay: 12s;
    }

    .still:nth-child(6),
    .still:nth-child(6) img {
      animation-delay: 15s;
    }

    .still:nth-child(7),
    .still:nth-child(7) img {
      animation-delay: 18s;
    }

    .still:nth-child(8),
    .still:nth-child(8) img {
      animation-delay: 21s;
    }

    .still:nth-child(9),
    .still:nth-child(9) img {
      animation-delay: 24s;
    }

    .still:nth-child(10),
    .still:nth-child(10) img {
      animation-delay: 27s;
    }


    /* =========================================================
       CROSSFADE
    ========================================================= */

    @keyframes cinematic-fade {

      0% {
        opacity: 0;
      }

      3% {
        opacity: 1;
      }

      10% {
        opacity: 1;
      }

      13% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }


    /* Very subtle movement */

    @keyframes cinematic-scale {

      0% {
        transform: scale(1);
      }

      13% {
        transform: scale(1.018);
      }

      100% {
        transform: scale(1.018);
      }
    }


    /* =========================================================
       CINEMATIC DARK TREATMENT
    ========================================================= */

    .hero-vignette {
      position: absolute;
      inset: 0;

      z-index: 2;

      pointer-events: none;

      background:

        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.50) 0%,
          rgba(0, 0, 0, 0.04) 25%,
          rgba(0, 0, 0, 0.04) 55%,
          rgba(0, 0, 0, 0.68) 100%
        ),

        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.30) 0%,
          transparent 38%,
          transparent 72%,
          rgba(0, 0, 0, 0.22) 100%
        );
    }


    /* =========================================================
       HERO CONTENT
    ========================================================= */

    .hero-content {
      position: absolute;

      z-index: 5;

      left: 3.5vw;
      bottom: 8vh;

      max-width: 900px;
    }


    /* Role */

    .eyebrow {
      margin-bottom: 15px;

      color: #B89A63;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.24em;

      text-transform: uppercase;
    }


    /* Main name */

    .hero-title {
      color: #F1EEE7;

      font-size: clamp(68px, 9vw, 140px);

      line-height: 0.86;

      font-weight: 300;

      letter-spacing: -0.06em;
    }


    /* Philosophy */

    .hero-subtitle {
      margin-top: 25px;

      max-width: 680px;

      color: rgba(241, 238, 231, 0.82);

      font-size: clamp(15px, 1.35vw, 19px);

      line-height: 1.5;

      letter-spacing: 0.015em;
    }


    /* View work */

    .hero-action {
      display: inline-flex;

      margin-top: 34px;

      padding-bottom: 8px;

      border-bottom:
        1px solid rgba(241, 238, 231, 0.75);

      color: #F1EEE7;

      text-decoration: none;

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.2em;

      text-transform: uppercase;

      transition:
        opacity 0.25s ease,
        border-color 0.25s ease;
    }

    .hero-action:hover {
      opacity: 0.55;
      border-color: transparent;
    }


    /* =========================================================
       BOTTOM RIGHT INFORMATION
    ========================================================= */

    .hero-meta {
      position: absolute;

      z-index: 5;

      right: 3.5vw;
      bottom: 8vh;

      color: rgba(241, 238, 231, 0.55);

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 0.2em;

      text-transform: uppercase;

      text-align: right;
    }


    /* =========================================================
       SCROLL INDICATOR
    ========================================================= */

    .scroll-note {
      position: absolute;

      z-index: 5;

      left: 3.5vw;
      bottom: 25px;

      color: rgba(241, 238, 231, 0.40);

      font-size: 9px;

      letter-spacing: 0.18em;

      text-transform: uppercase;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .nav {
        height: 68px;
        padding: 0 20px;
      }

      .brand {
        font-size: 12px;
        letter-spacing: 0.15em;
      }

      .nav-links {
        gap: 16px;
      }

      .nav-links a {
        font-size: 8px;
        letter-spacing: 0.12em;
      }

      .hero {
        min-height: 650px;
      }

      .hero-content {
        left: 20px;
        right: 20px;
        bottom: 70px;
      }

      .eyebrow {
        font-size: 8px;
        letter-spacing: 0.18em;
      }

      .hero-title {
        font-size: clamp(58px, 17vw, 100px);
      }

      .hero-subtitle {
        max-width: 90%;
        font-size: 14px;
      }

      .hero-meta {
        display: none;
      }

      .scroll-note {
        left: 20px;
        bottom: 22px;
      }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .still,
      .still img {
        animation: none;
      }

      .still:first-child {
        opacity: 1;
      }
    }

  </style>
</head>


<body>


  <!-- =========================================================
       NAVIGATION
  ========================================================= -->

  <header class="nav">

    <a class="brand" href="#">
      HARSH SINGH
    </a>

    <nav class="nav-links">

      <a href="#work">

      </a>

      <a href="#about">

      </a>

  </header>


  <!-- =========================================================

  ========================================================= -->

  <main>

    <section class="hero">


      <!-- =====================================================
           CINEMATIC IMAGE SLIDESHOW

           Final visual sequence:

           01 — Earth with sunlight
           08 — Ships firing
           02 — Earth from space
           03 — Red Earth / asteroids
           04 — Ocean waves
           07 — Steve screaming

      ====================================================== -->

      <div

        <div class="still">

        </div>

        <div class="still">
          <img src="images/still-03.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-04.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-07.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-05.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-09.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-06.jpg" alt="">
        </div>

        <div class="still">
          <img src="images/still-10.jpg" alt="">
        </div>

      </div>


      <!-- =====================================================
           DARK OVERLAY
      ====================================================== -->

      <div class="hero-vignette"></div>


      <!-- =====================================================

      ====================================================== -->

      <div class="hero-content">

        <div class="eyebrow">

        </div>

        <h1 class="hero-title">

        </h1>

        <p class="hero-subtitle">
          Where 3D, color and storytelling become experience.
        </p>

        <a
          class="hero-action"

      </div>


      <!-- Bottom-right supporting information -->

      <div class="hero-meta">

      </div>


      <!-- Scroll indicator -->

      <div class="scroll-note">
        Scroll to explore ↓

    </section>


    <!-- =========================================================
         FUTURE SECTIONS
    ========================================================== -->

    <section id="work" style="height: 1px;"></section>

    <section id="about" style="height: 1px;"></section>

    <section id="contact" style="height: 1px;"></section>


  </main>


</body>
</html>
