  <style>
    /* =========================================================
       FOUNDATION
    ========================================================= */

    * {

    body {

    }

    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .nav {

      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

    }

      letter-spacing: 0.18em;
      text-transform: uppercase;

      transition: opacity 0.25s ease;
    }

    .nav-links a:hover {

    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;
      min-height: 680px;

      overflow: hidden;

      background: #0A0A0A;
    }


    /* =========================================================
       CINEMATIC STILL SLIDESHOW
       
       10 images
       3 seconds visible per image
       1 second overlapping crossfade
       
       Total animation cycle: 30 seconds
    ========================================================= */

    .image-slideshow {
      position: absolute;
      inset: 0;

      z-index: 0;
      overflow: hidden;
      background: #0A0A0A;
    }

    .still {
      position: absolute;
      inset: 0;

      opacity: 0;

      animation:
        cinematic-fade 30s infinite;

      will-change: opacity, transform;
    }

    .still img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      filter: saturate(0.88);

      transform: scale(1.015);

      animation:
        cinematic-scale 30s infinite;

      will-change: transform;
    }


    /* Individual timing for each frame */

    .still:nth-child(1),
    .still:nth-child(1) img {
      animation-delay: 0s;
    }

    .still:nth-child(2),
    .still:nth-child(2) img {
      animation-delay: 3s;
    }

    .still:nth-child(3),
    .still:nth-child(3) img {
      animation-delay: 6s;
    }

    .still:nth-child(4),
    .still:nth-child(4) img {
      animation-delay: 9s;
    }

    .still:nth-child(5),
    .still:nth-child(5) img {
      animation-delay: 12s;
    }

    .still:nth-child(6),
    .still:nth-child(6) img {
      animation-delay: 15s;
    }

    .still:nth-child(7),
    .still:nth-child(7) img {
      animation-delay: 18s;
    }

    .still:nth-child(8),
    .still:nth-child(8) img {
      animation-delay: 21s;
    }

    .still:nth-child(9),
    .still:nth-child(9) img {
      animation-delay: 24s;
    }

    .still:nth-child(10),
    .still:nth-child(10) img {
      animation-delay: 27s;
    }


    /*
      Each image gets:
      - a fade in
      - a short period of full visibility
      - a fade out

      Because every image is stacked in exactly the same position,
      the transitions overlap naturally.
    */

    @keyframes cinematic-fade {

      0% {
        opacity: 0;
      }

      3% {
        opacity: 1;
      }

      10% {
        opacity: 1;
      }

      13% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes cinematic-scale {

      0% {
        transform: scale(1.015);
      }

      13% {
        transform: scale(1.035);
      }

      100% {
        transform: scale(1.035);
      }
    }


    /* =========================================================
       IMAGE TREATMENT
    ========================================================= */

    .still::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.42) 0%,
          rgba(0, 0, 0, 0.04) 30%,
          rgba(0, 0, 0, 0.08) 55%,
          rgba(0, 0, 0, 0.72) 100%
        ),

        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.35) 0%,
          transparent 40%,
          transparent 72%,
          rgba(0, 0, 0, 0.20) 100%
        );

      pointer-events: none;
    }


    /* =========================================================
       HERO CONTENT
    ========================================================= */

    .hero-content {
      position: absolute;

      z-index: 5;

      left: 3.5vw;
      bottom: 8vh;

      max-width: 900px;
    }


    /* Small role line */

    .eyebrow {

      color: #B89A63;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }


    /* Main name */

    .hero-title {
      color: #F1EEE7;

      font-size: clamp(70px, 10vw, 150px);
      line-height: 0.86;

      font-weight: 300;
      letter-spacing: -0.06em;
    }


    /* Philosophy line */

    .hero-subtitle {
      margin-top: 25px;

      max-width: 680px;

      color: rgba(241, 238, 231, 0.82);

      font-size: clamp(15px, 1.35vw, 19px);
      line-height: 1.5;

      letter-spacing: 0.015em;
    }


    /* View work */

    .hero-action {
      display: inline-flex;

      margin-top: 34px;
      padding-bottom: 8px;

      border-bottom: 1px solid rgba(241, 238, 231, 0.75);

      color: #F1EEE7;
      text-decoration: none;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;

      transition:
        opacity 0.25s ease,
        border-color 0.25s ease;
    }

    .hero-action:hover {
      opacity: 0.55;
      border-color: transparent;
    }


    /* =========================================================
       BOTTOM RIGHT META
    ========================================================= */

    .hero-meta {
      position: absolute;

      z-index: 5;

      right: 3.5vw;
      bottom: 8vh;

      color: rgba(241, 238, 231, 0.55);

      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;

      text-align: right;
    }


    /* =========================================================
       SCROLL INDICATOR
    ========================================================= */

    .scroll-note {
      position: absolute;

      z-index: 5;

      left: 3.5vw;
      bottom: 25px;

      color: rgba(241, 238, 231, 0.40);

      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .nav {
        height: 68px;

      }

    /* =========================================================

      .still,
      .still img {
        animation: none;
      }

      .still:first-child {
        opacity: 1;
      }
    }

  </style>
</head>
